<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./myStyle.css">
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>

    <div class="blackWrapper">
      <section class="card">
        <img src="./assets/images/avatar-jessica.jpeg" alt="profileImage">
        <section class="name">
          <h1>Jessica Randall</h1>
          <h2>London, United Kingdom</h2>
        </section>
        <p>"Front-end developer and avid reader."</p>
        <aside class="social-links">
          <h3 class="link one">GitHub</h3>
          <h3 class="link two">Frontend Mentor</h3>
          <h3 class="link three">LinkedIn</h3>
          <h3 class="link four">Twitter</h3>
          <h3 class="link five">Instagram</h3>
        </aside>
      </section>
    </div>
  
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">brian--2298</a>.
  </footer>

  <script src="./script.js"></script>
</body>
</html>
